<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#0b0f14" />
        <title>Incident Command API</title>
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <style>
            :root {
                color-scheme: dark;
                --surface: #12161c;
                --border: #262d38;
                --ink: #e6e9ef;
                --muted: #8b95a5;
                --accent: #5b8cff;
            }
            * { box-sizing: border-box; }
            body {
                display: grid;
                place-content: center;
                min-height: 100vh;
                margin: 0;
                background: var(--surface);
                color: var(--ink);
                font-family: Roboto, Arial, sans-serif;
            }
            main {
                display: grid;
                gap: 12px;
                padding: 40px 48px;
                border: 1px solid var(--border);
                border-radius: 16px;
                text-align: center;
            }
            h1 { margin: 0; font-size: 22px; font-weight: 500; }
            p { margin: 0; color: var(--muted); font-size: 14px; }
            a { color: var(--accent); }
        </style>
    </head>
    <body>
        <main>
            <h1>Incident Command API</h1>
            <p>The backend is running. The frontend is served separately on port 3000.</p>
            <p><a href="/api/v1/health">/api/v1/health</a></p>
        </main>
    </body>
</html>
